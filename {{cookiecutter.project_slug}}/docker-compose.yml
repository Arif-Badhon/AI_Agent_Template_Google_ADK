version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - POSTGRES_URL=postgresql://admin:password@postgres:5432/agent_db
    volumes:
      - ./src:/app/src
    depends_on:
      - qdrant
      - postgres

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  admin_dashboard:
    build: .
    command: [ "uv", "run", "streamlit", "run", "src/interface/admin.py", "--server.port=8501" ]
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - POSTGRES_URL=postgresql://admin:password@postgres:5432/agent_db
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs # Share logs with the dashboard
    depends_on:
      - api

  interface:
    build: .
    command: [ "uv", "run", "streamlit", "run", "src/interface/app.py", "--server.port=8502" ]
    ports:
      - "8502:8502"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs # Share logs with the dashboard
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:8000

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  qdrant_data:
  pg_data:
