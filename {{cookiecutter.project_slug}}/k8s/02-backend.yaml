apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: {{cookiecutter.project_slug}}-prod
spec:
  replicas: 2 # Bulletproof: Run 2 copies for high availability
  selector:
    matchLabels:
      app: agent-api
  template:
    metadata:
      labels:
        app: agent-api
    spec:
      containers:
      - name: api
        # In a real pipeline, 'latest' is replaced with a specific commit hash/tag
        image: your-docker-registry.com/{{cookiecutter.project_slug}}-api:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        # Bulletproof health checks
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: {{cookiecutter.project_slug}}-prod
spec:
  selector:
    app: agent-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000