apiVersion: v1
kind: Namespace
metadata:
  name: {{cookiecutter.project_slug}}-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{cookiecutter.project_slug}}-prod
data:
  # Non-sensitive configuration
  AGENT_MODEL: "gemini-1.5-flash"
  LOG_LEVEL: "INFO"
  API_BASE_URL: "http://api-service:8000"
  QDRANT_HOST: "qdrant-service" # Assuming you deploy Qdrant to K8s as well
  LOG_FILE_PATH: "/app/logs/app.log"
  COST_PER_1M_INPUT_TOKENS: "0.075"
  COST_PER_1M_OUTPUT_TOKENS: "0.30"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: {{cookiecutter.project_slug}}-prod
type: Opaque
stringData:
  # In a real environment, you'd use a tool like ExternalSecrets or SOPS
  # For the template, users will replace these before applying
  GOOGLE_API_KEY: "replace_me_before_applying"
  API_KEY: "replace_me_with_secure_string"
  ADMIN_PASSWORD: "change_this_immediately"
  POSTGRES_URL: "postgresql://admin:password@postgres-service:5432/agent_db"